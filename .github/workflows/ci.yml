name: CI

# Runs the ferroscan review-loop verification gates on infrastructure that can
# reach crates.io. These four checks are the deterministic authority defined in
# CLAUDE.md ("Definition of done"): fmt, clippy (-D warnings), build, and test.
# A change is only "kept" once this workflow is green.

on:
  push:
    branches: ["**"]
  pull_request:

# The upgrade loop pushes frequently; cancel a ref's in-flight run when a newer
# commit arrives so we always gate the latest state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable (with clippy + rustfmt)
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version && cargo --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --- The four gates, matched verbatim to CLAUDE.md ---

      - name: Format check (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Clippy (cargo clippy --all-targets -- -D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (cargo build --all-targets)
        run: cargo build --all-targets --verbose

      - name: Test (cargo test)
        run: cargo test --verbose
