[package]
name = "ferroscan"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Fast, safety-first network vulnerability scanner for authorized defensive assessments"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["security", "scanner", "network", "portscan", "defensive"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "ferroscan"
path = "src/main.rs"

[lib]
name = "ferroscan"
path = "src/lib.rs"

[dependencies]
# Async runtime — the source of the scan speed.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal"] }
# CLI (derive API).
clap = { version = "4", features = ["derive"] }
# Serialization — JSON report is the machine-readable source of truth.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Target parsing: CIDR blocks and IP ranges.
ipnet = "2"
# Read (and optionally raise) the file-descriptor limit for adaptive batching.
rlimit = "0.10"
# Global/per-host rate limiting.
governor = "0.6"
# Progress UX.
indicatif = "0.17"
# Structured logging / tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Error handling.
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
